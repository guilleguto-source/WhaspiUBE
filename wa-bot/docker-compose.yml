services:
  # Base de datos relacional para Evolution API v2
  postgres:
    image: postgres:16-alpine
    container_name: ube-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

  # Redis para cola de eventos y caché de Evolution API
  redis:
    image: redis:7-alpine
    container_name: ube-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M

  # Gateway de WhatsApp: Evolution API v2 (Motor Baileys, ultra liviano)
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: ube-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Definir EVOLUTION_API_KEY en .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CONFIG_SESSION_PHONE_CLIENT: "Ubuntu"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1043857760"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://wa-bot:3000/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_GLOBAL_BASE64: "true"
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          memory: 450M

  # Cerebro del Bot: Node.js + Python RapidOCR + SQLite integrado
  wa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ube-wa-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-ube-bot}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      UBE_MATERIAL_DIR: /app/material
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - bot_data:/app/data
      - ${UBE_MATERIAL_HOST_PATH:-./material}:/app/material:ro
    depends_on:
      - evolution-api
    deploy:
      resources:
        limits:
          memory: 500M

volumes:
  postgres_data:
  redis_data:
  bot_data:
